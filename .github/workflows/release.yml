name: Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: false

      - name: Build Binaries
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/jk-linux-amd64 .
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/jk-linux-arm64 .
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/jk-windows-amd64.exe .
          cd dist && sha256sum * > checksums.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jk-binaries
          path: dist/*

      - name: Publish Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            gh release upload latest dist/* --clobber || \
            gh release create latest dist/* --title "Latest Build (main)" --notes "Automated rolling release from commit ${{ github.sha }}" --prerelease
          elif [ "${{ github.event_name }}" = "release" ]; then
            gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber
          elif [[ "${{ github.ref_name }}" =~ ^v ]]; then
            gh release upload "${{ github.ref_name }}" dist/* --clobber || \
            gh release create "${{ github.ref_name }}" dist/* --title "${{ github.ref_name }}" --generate-notes
          fi
